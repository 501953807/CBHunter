<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=420">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:420px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f8f9fa; font-size:13px; }
  .container { padding:14px; }

  .header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .logo { width:26px; height:26px; border-radius:7px; background:linear-gradient(135deg,#92174d,#e00b41); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:bold; }
  .header-title { font-size:15px; font-weight:600; color:#1a1a1a; }
  .header-sub { font-size:10px; color:#999; }

  .login-box { background:#fff; border-radius:10px; padding:14px; border:1px solid #e5e5e5; margin-bottom:10px; }
  .login-box label { font-size:11px; font-weight:600; color:#666; display:block; margin-bottom:3px; }
  .login-box input { width:100%; padding:7px 10px; border:1px solid #e5e5e5; border-radius:7px; font-size:13px; outline:none; margin-bottom:8px; }
  .login-box input:focus { border-color:#92174d; }
  .login-row { display:flex; gap:6px; }
  .login-row input { flex:1; margin-bottom:0; }

  .btn { display:inline-flex; align-items:center; justify-content:center; gap:4px; padding:8px 16px; border-radius:8px; font-size:13px; font-weight:500; border:none; cursor:pointer; transition:all .15s; }
  .btn-primary { background:linear-gradient(135deg,#92174d,#e00b41); color:#fff; width:100%; }
  .btn-primary:hover { opacity:.9; }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }

  .product-form { background:#fff; border-radius:10px; padding:14px; border:1px solid #e5e5e5; }
  .field { margin-bottom:10px; }
  .field label { font-size:10px; font-weight:600; color:#888; text-transform:uppercase; letter-spacing:.4px; display:block; margin-bottom:3px; }
  .field input, .field select { width:100%; padding:7px 10px; border:1px solid #e5e5e5; border-radius:7px; font-size:13px; outline:none; background:#fff; }
  .field input:focus, .field select:focus { border-color:#92174d; }
  .field-row { display:flex; gap:8px; }
  .field-row .field { flex:1; }

  .imgs-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .img-thumb { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:2px solid #eee; cursor:pointer; transition:border-color .15s; }
  .img-thumb:hover { border-color:#d0d0d0; }
  .img-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .img-thumb.selected { border-color:#92174d; }
  .img-thumb .check { position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:#92174d; color:#fff; display:none; align-items:center; justify-content:center; font-size:10px; font-weight:bold; }
  .img-thumb.selected .check { display:flex; }

  .platform-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:5px; font-size:11px; font-weight:600; color:#fff; margin-bottom:10px; }
  .platform-badge.shopee { background:#EE4D2D; }
  .platform-badge.tiktok { background:#000; }
  .platform-badge.temu { background:#E7322B; }
  .platform-badge.ali1688 { background:#FF6A00; }
  .platform-badge.unknown { background:#888; }

  .status { font-size:11px; padding:6px 10px; border-radius:7px; margin-top:8px; display:none; }
  .status.ok { background:#ecfdf5; color:#065f46; display:block; }
  .status.err { background:#fef2f2; color:#991b1b; display:block; }
  .status.info { background:#eff6ff; color:#1e40af; display:block; }

  .hidden { display:none !important; }
  .hint { font-size:10px; color:#999; margin-top:2px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">CB</div>
    <div>
      <div class="header-title">CBHunter 采集助手</div>
      <div class="header-sub" id="pageStatus">等待加载...</div>
    </div>
  </div>

  <div id="loginBox" class="login-box">
    <label>后端地址</label>
    <input id="serverUrl" value="http://localhost:8000" placeholder="http://localhost:8000">
    <div class="login-row">
      <input id="loginUser" placeholder="用户名" style="flex:1">
      <input id="loginPass" type="password" placeholder="密码" style="flex:1">
    </div>
    <button class="btn btn-primary" id="loginBtn" style="margin-top:8px;">登录</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <div id="mainForm" class="hidden">
    <div id="platformBadge" class="platform-badge unknown">🌐 当前页面</div>

    <div class="product-form">
      <div class="field">
        <label>商品标题 *</label>
        <input id="prodTitle" placeholder="商品完整标题...">
      </div>

      <div class="field-row">
        <div class="field">
          <label>市场/币种</label>
          <select id="marketSelect">
            <option value="MY">🇲🇾 马来西亚 (MYR)</option>
            <option value="PH">🇵🇭 菲律宾 (PHP)</option>
            <option value="SG">🇸🇬 新加坡 (SGD)</option>
            <option value="TH">🇹🇭 泰国 (THB)</option>
            <option value="VN">🇻🇳 越南 (VND)</option>
            <option value="ID">🇮🇩 印尼 (IDR)</option>
            <option value="TW">🇹🇼 台湾 (TWD)</option>
            <option value="US">🇺🇸 美国 (USD)</option>
            <option value="CN">🇨🇳 中国 (CNY)</option>
            <option value="BR">🇧🇷 巴西 (BRL)</option>
          </select>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>价格 (原币) *</label>
          <input id="prodPrice" type="number" step="0.01" placeholder="自动提取">
        </div>
        <div class="field">
          <label>≈ 人民币</label>
          <input id="prodPriceCNY" readonly placeholder="自动换算" style="background:#f8f9fa;color:#666;">
        </div>
      </div>

      <div class="field">
        <label>已售数量 (不是月销量估算)</label>
        <input id="prodSales" type="number" placeholder="自动提取已售/已售量">
      </div>

      <div class="field">
        <label>SKU / 变体 (多个用逗号分隔)</label>
        <input id="prodSKU" placeholder="RED-L, BLUE-M, BLACK-XL 或单一SKU">
      </div>

      <div class="field-row">
        <div class="field">
          <label>评分</label>
          <input id="prodRating" type="number" step="0.1" min="0" max="5" placeholder="4.5">
        </div>
        <div class="field">
          <label>店铺</label>
          <input id="prodShop" placeholder="店铺名称">
        </div>
      </div>

      <div class="field">
        <label>一级类目</label>
        <input id="prodCategory" placeholder="自动识别或手动输入">
      </div>

      <div class="field">
        <label>商品图片（点击缩略图选中/取消，最多10张）</label>
        <div class="imgs-grid" id="imgGrid">
          <span style="font-size:11px;color:#aaa;padding:8px;">打开商品页后自动提取...</span>
        </div>
        <div style="margin-top:6px;font-size:10px;color:#888;">
          已选 <b id="imgCount">0</b>/10 张
        </div>
      </div>

      <button class="btn btn-primary" id="collectBtn" disabled>
        📥 采集到 CBHunter
      </button>
      <div class="status" id="collectStatus"></div>
    </div>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
