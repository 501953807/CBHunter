services:
  backend:
    build:
      context: ./backend
    environment:
      SECRET_KEY: ${CBHUNTER_SECRET_KEY}
      ENCRYPTION_KEY: ${CBHUNTER_ENCRYPTION_KEY}
      DATABASE_URL: sqlite+aiosqlite:///./data/shop.db
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - cbhunter-backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  cbhunter-backend-data:
